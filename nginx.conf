server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # The service worker, its registration file, the manifest and index.html
  # must never be cached, or installed apps keep running an old version.
  location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Built files have a content hash in their name, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
